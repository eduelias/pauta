# Checks for every push and pull request, and the first stage of a release (release.yml
# calls this workflow, so a tag only ships what passed the same checks).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    # what a release deploys: du7 installs the wheel and lockfile with these hashes, no others
    outputs:
      wheel_sha256:
        value: ${{ jobs.build.outputs.wheel_sha256 }}
      lock_sha256:
        value: ${{ jobs.build.outputs.lock_sha256 }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_FROZEN: "1" # uv.lock is the truth; a stale lock fails `uv lock --check` below
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Lockfile is up to date
        run: uv lock --check
        env:
          UV_FROZEN: "false"
      - name: Ruff (lint)
        run: uv run --extra dev ruff check --output-format=github src tests scripts tools
      - name: Ruff (format)
        run: uv run --extra dev ruff format --check src tests scripts tools
      - name: JavaScript parses
        run: for f in src/pauta/static/app*.js; do node --check "$f"; done
      - name: Deploy scripts (shellcheck)
        run: shellcheck deploy/pauta-deploy deploy/pauta-deploy-branch deploy/provision-du7.sh deploy/provision-branch-env.sh deploy/runner-job-guard scripts/repo-settings.sh
      - name: Workflows (actionlint)
        # the PyPI wheel of the same release: the rhysd/actionlint action builds it from
        # source on every run (37 s of the job's 50)
        run: uvx --from actionlint-py==1.7.12.25 actionlint

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # du7 runs 3.11 (Debian bookworm); the newer ones catch deprecations early
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Unit and API tests, with coverage (du7's Python)
        if: matrix.python == '3.11'
        run: >-
          uv run --extra dev pytest -n auto --cov --cov-report=term --cov-report=xml
          --junitxml=test-results/junit.xml
      - name: Unit and API tests
        if: matrix.python != '3.11'
        run: uv run --extra dev pytest -n auto --junitxml=test-results/junit.xml
      - name: Coverage summary
        if: always() && matrix.python == '3.11'
        run: |
          {
            echo "### Coverage"
            echo '```'
            uv run --extra dev coverage report --skip-covered --show-missing || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-${{ matrix.python }}
          path: |
            test-results/
            coverage.xml
          retention-days: 14

  e2e:
    name: Browser (end to end)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Playwright version (the browser cache key)
        id: pw
        run: |
          version=$(uv run --extra dev --extra e2e playwright --version | cut -d' ' -f2)
          test -n "$version" || { echo "no Playwright version: the cache key would be shared across bumps"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Chromium from the cache
        id: chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Chromium's system libraries (apt; the cache holds only the browser)
        run: uv run --extra dev --extra e2e playwright install-deps chromium
      - name: Install Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        run: uv run --extra dev --extra e2e playwright install chromium
      - name: Journeys and screens in Chromium (virtual passkeys)
        run: uv run --extra dev --extra e2e pytest -m e2e -n auto --junitxml=test-results/e2e.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 14

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
      - name: Known vulnerabilities in what ships (pip-audit)
        run: |
          uv export --no-dev --no-emit-project --format requirements-txt -o runtime.txt
          uvx pip-audit --strict --require-hashes --disable-pip -r runtime.txt

  build:
    name: Build and smoke test
    needs: [lint, test, e2e, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      wheel_sha256: ${{ steps.sums.outputs.wheel }}
      lock_sha256: ${{ steps.sums.outputs.lock }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
      - name: Build the wheel and sdist
        run: uv build
      - name: Pin the runtime dependencies (with hashes) for the deploy
        run: >-
          uv export --no-dev --no-emit-project --format requirements-txt
          -o dist/requirements.lock
      - name: Checksums
        id: sums
        # here, before the wheel is installed or run: the smoke test can't change what they say
        run: |
          cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
          echo "wheel=$(sha256sum pauta-*.whl | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "lock=$(sha256sum requirements.lock | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: The wheel carries the web app
        run: |
          wheel=$(ls dist/pauta-*.whl)
          for f in index.html app.js app-requests.js app-clients.js app-financeiro.js app-campanhas.js app-team.js app-perfil.js app-router.js \
                   style.css vendor/qrcode.js og.png manifest.json; do
            unzip -l "$wheel" "pauta/static/$f" > /dev/null || { echo "missing static/$f"; exit 1; }
          done
      - name: Install it like du7 does, start it, ask /healthz
        run: |
          uv venv -q --seed --python 3.11 /tmp/rel
          /tmp/rel/bin/pip install -q --require-hashes --only-binary=:all: -r dist/requirements.lock
          /tmp/rel/bin/pip install -q --no-deps dist/pauta-*.whl
          version=$(/tmp/rel/bin/pauta --version | cut -d' ' -f2)
          PAUTA_STATE_DIR=/tmp/state /tmp/rel/bin/pauta serve --port 8099 &
          for _ in $(seq 30); do curl -fsS localhost:8099/healthz && break; sleep 0.3; done
          test "$(curl -fsS localhost:8099/healthz | jq -r .version)" = "$version"
          curl -fsS localhost:8099/ | grep -q 'og:image'
          echo "pauta $version: installs, starts and answers" >> "$GITHUB_STEP_SUMMARY"
      - name: What is uploaded is what was hashed
        run: cd dist && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 30
