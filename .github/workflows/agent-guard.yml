# Coding-agent PRs (label `agent` or branch `agent/...`) may not touch CI, the deploy,
# sign-in, rate limiting, the scripts, dependencies or the coverage gate.
#
# pull_request_target: this workflow and scripts/agent_guard.py come from the base branch,
# so a PR cannot edit the check that judges it. It never checks out or runs the PR's code,
# only reads its file list and pyproject.toml through the API, and has no secrets.
# Make "Agent guard / Agent PR scope" a required check on main.
name: Agent guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: agent-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: Agent PR scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Agent PRs stay in their lane
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/agent_guard.py "$GITHUB_EVENT_PATH"
