# Push a tag vX.Y.Z (scripts/release.py cut X.Y.Z --push) and this runs the full CI, builds
# the release, publishes it on GitHub with its CHANGELOG notes, then deploys it to du7: the
# files this run built, by their sha256, never files from the release page.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish ${{ github.ref_name }}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the previous tag, for the compare link
      - name: Tag, pyproject and CHANGELOG agree
        id: version
        run: echo "version=$(python3 scripts/release.py check-tag "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 scripts/release.py notes "$VERSION" > notes.md
          prev=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -1 || true)
          {
            echo
            echo "---"
            echo "Deployed to https://app.pauta.cc by the *Deploy* job of this run."
            if [ -n "$prev" ]; then
              echo "Full diff: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_REF_NAME"
            fi
          } >> notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          WHEEL_SHA256: ${{ needs.ci.outputs.wheel_sha256 }}
          LOCK_SHA256: ${{ needs.ci.outputs.lock_sha256 }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          echo "$WHEEL_SHA256  dist/pauta-$VERSION-py3-none-any.whl" | sha256sum -c -
          echo "$LOCK_SHA256  dist/requirements.lock" | sha256sum -c -
          # a release someone else made for this tag would carry their files: refuse it
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "::error::a release for $GITHUB_REF_NAME already exists; only this run makes one (a draft left by a failed attempt of this run: delete it, then re-run)"
            exit 1
          fi
          # releases are immutable once published: attach everything to a draft, then publish
          gh release create "$GITHUB_REF_NAME" dist/* --draft \
            --verify-tag --title "Pauta $VERSION" --notes-file notes.md
          gh release edit "$GITHUB_REF_NAME" --draft=false
          # published (immutable from here): what anyone downloads is what was built
          # (asked a few times: a release just published may not answer in its first second)
          for _ in 1 2 3; do
            gh release download "$GITHUB_REF_NAME" --dir published --clobber && break
            sleep 5
          done
          (cd dist && sha256sum -- *) | sort -k2 > built.sums
          (cd published && sha256sum -- *) | sort -k2 > published.sums
          diff built.sums published.sums || { echo "::error::the published files are not the build's"; exit 1; }

  deploy:
    name: Deploy
    needs: [ci, publish]
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.publish.outputs.version }}
      # of this run's own build, never read from the release page
      wheel_sha256: ${{ needs.ci.outputs.wheel_sha256 }}
      lock_sha256: ${{ needs.ci.outputs.lock_sha256 }}

  alert:
    name: WhatsApp if the release failed
    needs: [ci, publish, deploy]
    if: failure()
    runs-on: ubuntu-latest
    # the WhatsApp secrets live in the `alerts` environment: main and release tags only
    environment: alerts
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/alert.py
          sparse-checkout-cone-mode: false
      - name: Send the alert template
        env:
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
          WA_TO: ${{ secrets.WA_TO }}
          WA_TEMPLATE: ${{ vars.WA_TEMPLATE }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STAGES: >-
            CI ${{ needs.ci.result }}, publish ${{ needs.publish.result }},
            deploy ${{ needs.deploy.result }}
        run: |
          python3 scripts/alert.py "pauta release $GITHUB_REF_NAME" \
            "failed ($STAGES). A failed deploy rolls back to the previous release. $RUN"
