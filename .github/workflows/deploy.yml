# Put a release on du7. Called by release.yml with the hashes of the wheel and lockfile
# that run built: du7 installs those exact bytes (the run's own `dist` artifact) and nothing
# else, never files from the release page. Run by hand (Actions → Deploy → Run workflow), it
# only switches du7 to a release that is already installed there: a redeploy or a rollback.
#
# The du7 job runs on the self-hosted runner as `gh-runner`, which may run exactly one
# command as root: /usr/local/sbin/pauta-deploy (deploy/pauta-deploy in this repo). Before any
# step, the runner's job guard (deploy/runner-job-guard) checks that the owner started this
# from a release tag or from main. pauta-deploy checks the hashes, installs into its own
# venv, backs up the DB, switches, health-checks and rolls back on failure.
name: Deploy

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      wheel_sha256:
        type: string
        required: true
      lock_sha256:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: An installed release to switch du7 to (X.Y.Z, without the v)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  du7:
    name: du7 → pauta.genic.dev
    runs-on: [self-hosted, du7, pauta]
    timeout-minutes: 15
    environment:
      name: production
      url: https://pauta.genic.dev
    steps:
      - name: du7 has the pauta-deploy this workflow needs
        run: |
          sudo -n /usr/local/sbin/pauta-deploy --capabilities | grep -qx "pinned activate" || {
            echo "::error::du7 runs an older pauta-deploy: run deploy/provision-du7.sh there"
            exit 1
          }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name != 'workflow_dispatch'
        with:
          name: dist
          path: bundle
      - name: Install this run's build, switch, health check (rolls back on failure)
        if: github.event_name != 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
          WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
          LOCK_SHA256: ${{ inputs.lock_sha256 }}
        run: |
          sudo -n /usr/local/sbin/pauta-deploy "$VERSION" \
            "$PWD/bundle/pauta-$VERSION-py3-none-any.whl" "$PWD/bundle/requirements.lock" \
            "$WHEEL_SHA256" "$LOCK_SHA256"
      - name: Switch to the installed release (rolls back on failure)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: sudo -n /usr/local/sbin/pauta-deploy --activate "$VERSION"
      - name: Caddy serves it (TLS on du7)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Caddy listens on du7's LAN address only: ask it there, not through the internet
          lan=$(hostname -I | cut -d' ' -f1)
          live=$(curl -fsS --resolve "pauta.genic.dev:443:$lan" https://pauta.genic.dev/healthz \
            | python3 -I -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          [ "$live" = "$VERSION" ] || { echo "Caddy serves ${live:-nothing}, expected $VERSION"; exit 1; }
          {
            echo "### du7 is on $VERSION"
            echo '```'
            sudo -n /usr/local/sbin/pauta-deploy --status
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  public:
    name: Reachable from the internet
    needs: du7
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: https://pauta.genic.dev answers with the new version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for _ in $(seq 20); do
            live=$(curl -fsS https://pauta.genic.dev/healthz | jq -r .version) && [ "$live" = "$VERSION" ] && break
            sleep 3
          done
          [ "$live" = "$VERSION" ] || { echo "pauta.genic.dev says ${live:-nothing}, expected $VERSION"; exit 1; }
          curl -fsS https://pauta.genic.dev/ | grep -q 'og:image'
          echo "pauta.genic.dev answers $VERSION from the internet" >> "$GITHUB_STEP_SUMMARY"

  alert:
    name: WhatsApp if the deploy failed
    needs: [du7, public]
    # a deploy started by a release is reported by release.yml's own alert job
    if: failure() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # the WhatsApp secrets live in the `alerts` environment: main and release tags only
    environment: alerts
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/alert.py
          sparse-checkout-cone-mode: false
      - name: Send the alert template
        env:
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
          WA_TO: ${{ secrets.WA_TO }}
          WA_TEMPLATE: ${{ vars.WA_TEMPLATE }}
          VERSION: ${{ inputs.version }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STAGES: >-
            du7 ${{ needs.du7.result }}, internet check ${{ needs.public.result }}
        run: |
          python3 scripts/alert.py "pauta deploy $VERSION" \
            "failed ($STAGES). A failed deploy rolls back to the previous release. $RUN"
