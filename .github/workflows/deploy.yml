# Put a release on du7. Called by release.yml with the sha256 of the wheel and of the lockfile
# that run built: du7 installs that run's own `dist` artifact, checked against those hashes,
# and nothing from the release page. Run by hand (Actions → Deploy → Run workflow) it installs
# nothing: it only switches du7 to a release that is already installed there (a rollback, or
# back again).
#
# The du7 job runs on the self-hosted runner as `gh-runner`, which may run exactly one
# command as root: /usr/local/sbin/pauta-deploy (deploy/pauta-deploy in this repo). That
# script checks the hashes, installs into its own venv, backs up the DB, switches,
# health-checks and rolls back on failure.
name: Deploy

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      wheel_sha256:
        type: string
        required: true
      lock_sha256:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: A release already installed on du7 to switch to (X.Y.Z, without the v). Installs nothing
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  du7:
    name: du7 → app.pauta.cc
    runs-on: [self-hosted, du7, pauta]
    timeout-minutes: 15
    environment:
      name: production
      url: https://app.pauta.cc
    steps:
      - name: du7 has the pauta-deploy this workflow needs
        run: |
          sudo -n /usr/local/sbin/pauta-deploy --capabilities | grep -qx "pinned activate" || {
            echo "::error::du7 runs an older pauta-deploy: run deploy/provision-du7.sh there (deploy/README.md, Collaborators)"
            exit 1
          }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name != 'workflow_dispatch'
        with:
          name: dist # this run's build (ci.yml)
          path: bundle
      - name: Install this run's build, switch, health check (rolls back on failure)
        if: github.event_name != 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
          WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
          LOCK_SHA256: ${{ inputs.lock_sha256 }}
        run: |
          sudo -n /usr/local/sbin/pauta-deploy "$VERSION" \
            "bundle/pauta-$VERSION-py3-none-any.whl" bundle/requirements.lock \
            "$WHEEL_SHA256" "$LOCK_SHA256"
      - name: Switch to a release already installed on du7 (rolls back on failure)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: sudo -n /usr/local/sbin/pauta-deploy --activate "$VERSION"
      - name: Caddy serves it (TLS on du7)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          live=$(curl -fsS --resolve app.pauta.cc:443:192.168.2.68 https://app.pauta.cc/healthz \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          [ "$live" = "$VERSION" ] || { echo "Caddy serves ${live:-nothing}, expected $VERSION"; exit 1; }
          {
            echo "### du7 is on $VERSION"
            echo '```'
            sudo -n /usr/local/sbin/pauta-deploy --status
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  public:
    name: Reachable from the internet
    needs: du7
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: https://app.pauta.cc answers with the new version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for _ in $(seq 20); do
            live=$(curl -fsS https://app.pauta.cc/healthz | jq -r .version) && [ "$live" = "$VERSION" ] && break
            sleep 3
          done
          [ "$live" = "$VERSION" ] || { echo "app.pauta.cc says ${live:-nothing}, expected $VERSION"; exit 1; }
          curl -fsS https://app.pauta.cc/ | grep -q 'og:image'
          echo "app.pauta.cc answers $VERSION from the internet" >> "$GITHUB_STEP_SUMMARY"

  alert:
    name: WhatsApp if the deploy failed
    needs: [du7, public]
    # a deploy started by a release is reported by release.yml's own alert job
    if: failure() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # the WhatsApp secrets live in the `alerts` environment: main and release tags only
    environment: alerts
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/alert.py
          sparse-checkout-cone-mode: false
      - name: Send the alert template
        env:
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
          WA_TO: ${{ secrets.WA_TO }}
          WA_TEMPLATE: ${{ vars.WA_TEMPLATE }}
          VERSION: ${{ inputs.version }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STAGES: >-
            du7 ${{ needs.du7.result }}, internet check ${{ needs.public.result }}
        run: |
          python3 scripts/alert.py "pauta deploy $VERSION" \
            "failed ($STAGES). A failed deploy rolls back to the previous release. $RUN"
