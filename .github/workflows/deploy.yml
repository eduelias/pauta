# Put a published release on du7. Runs after every release, and by hand (Actions → Deploy →
# Run workflow) to redeploy or roll back to any earlier version.
#
# The du7 job runs on the self-hosted runner as `gh-runner`, which may run exactly one
# command as root: /usr/local/sbin/pauta-deploy (deploy/pauta-deploy in this repo). That
# script installs into its own venv, backs up the DB, switches, health-checks and rolls
# back on failure.
name: Deploy

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Release to put on du7 (X.Y.Z, without the v)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  fetch:
    name: Fetch v${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version: $VERSION"; exit 1; }
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir bundle \
            --pattern "pauta-$VERSION-py3-none-any.whl" --pattern requirements.lock \
            --pattern SHA256SUMS
          cd bundle && sha256sum -c --ignore-missing SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-bundle-${{ inputs.version }}
          path: bundle/
          retention-days: 7

  du7:
    name: du7 → pauta.genic.dev
    needs: fetch
    runs-on: [self-hosted, du7, pauta]
    timeout-minutes: 15
    environment:
      name: production
      url: https://pauta.genic.dev
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deploy-bundle-${{ inputs.version }}
          path: bundle
      - name: Install, switch, health check (rolls back on failure)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sudo -n /usr/local/sbin/pauta-deploy "$VERSION" \
            "bundle/pauta-$VERSION-py3-none-any.whl" bundle/requirements.lock
      - name: Caddy serves it (TLS on du7)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          live=$(curl -fsS --resolve pauta.genic.dev:443:192.168.2.68 https://pauta.genic.dev/healthz \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          [ "$live" = "$VERSION" ] || { echo "Caddy serves ${live:-nothing}, expected $VERSION"; exit 1; }
          {
            echo "### du7 is on $VERSION"
            echo '```'
            sudo -n /usr/local/sbin/pauta-deploy --status
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  public:
    name: Reachable from the internet
    needs: du7
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: https://pauta.genic.dev answers with the new version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for _ in $(seq 20); do
            live=$(curl -fsS https://pauta.genic.dev/healthz | jq -r .version) && [ "$live" = "$VERSION" ] && break
            sleep 3
          done
          [ "$live" = "$VERSION" ] || { echo "pauta.genic.dev says ${live:-nothing}, expected $VERSION"; exit 1; }
          curl -fsS https://pauta.genic.dev/ | grep -q 'og:image'
          echo "pauta.genic.dev answers $VERSION from the internet" >> "$GITHUB_STEP_SUMMARY"
