<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ebeaf3">
  <meta name="robots" content="noindex, nofollow">
  <!-- the client's copy of a campaign report (decision 12): /r/<token>, no account. The server
       fills the title and og: tags in (WhatsApp's preview crawler runs no JS); app-report.js draws the card. -->
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Pauta">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:url" content="{{url}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:image" content="{{origin}}/og.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="report public">
  <main id="app" class="main" aria-live="polite"><div class="loading"><div class="spinner"></div></div></main>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript><p class="public-note">Este relatório precisa de JavaScript para aparecer.</p></noscript>
  <!-- bundle report.bundle.js -->
  <script src="/app.js"></script>
  <script src="/app-campanhas.js"></script>
  <script src="/app-report.js"></script>
  <!-- /bundle -->
</body>
</html>
