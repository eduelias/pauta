[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pauta"
version = "0.1.0"
description = "Pauta: the request queue between whoever sells the campaign and whoever runs it."
requires-python = ">=3.11"
authors = [{ name = "Eduardo Elias Saleh" }]
dependencies = [
    # the one exception to "stdlib only": passkey signature checks need real crypto
    "webauthn>=2.2,<4",
]

[project.scripts]
pauta = "pauta.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/pauta"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
